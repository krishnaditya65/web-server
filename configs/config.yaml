server:
  host: "0.0.0.0"
  port: 8080
  https_port: 8443
  read_timeout: 15
  write_timeout: 15
  idle_timeout: 60
  tls_cert_file: "./certs/server.crt"
  tls_key_file: "./certs/server.key"
  redirect_http_to_https: false

admin:
  enabled: true
  host: "127.0.0.1"
  port: 8090

gzip:
  enabled: true
  level: 6
  min_length: 1024
  content_types:
    - "text/plain"
    - "text/html"
    - "text/css"
    - "application/json"
    - "application/javascript"

# Global plugins — applied to every route before per-route plugins.
plugins:
  - name: "rate-limit"
    enabled: true
    config:
      requests_per_second: 20
      burst: 50

proxy:
  algorithm: "weighted_rr"
  routes:
    - name: "users"
      host: ""
      path_prefix: "/users"
      timeout_seconds: 10
      max_body_bytes: 10485760   # 10 MB
      max_retries: 3
      circuit_breaker:
        failure_threshold: 5
        open_duration_seconds: 60
        half_open_requests: 2
      upstreams:
        - url: "http://localhost:9001"
          weight: 3
        - url: "http://localhost:9002"
          weight: 1
      plugins:
        - name: "jwt"
          enabled: false
          config:
            secret: "change-me-before-enabling"
            algorithm: "HS256"
            claims_to_headers:
              sub: "X-User-ID"
              email: "X-User-Email"

        - name: "key-auth"
          enabled: false
          config:
            header: "X-API-Key"
            keys:
              - "replace-with-real-key"
            hide_credentials: true

        - name: "ip-restriction"
          enabled: false
          config:
            allow:
              - "127.0.0.1"
              - "10.0.0.0/8"

        - name: "rate-limit"
          enabled: true
          config:
            requests_per_second: 5
            burst: 10

        - name: "response-header-transformer"
          enabled: true
          config:
            add_headers:
              X-Powered-By: "web-server-gateway"
            remove_headers:
              - "Server"

    - name: "default"
      host: ""
      path_prefix: "/"
      timeout_seconds: 30
      max_retries: 2
      upstreams:
        - url: "http://localhost:9001"
          weight: 1

rate_limit:
  requests_per_second: 20
  burst: 50

health:
  path: "/"
  interval_seconds: 5
  timeout_seconds: 2
