# Sample nginx.conf for web-server-gateway
# Usage: ./server --config configs/nginx.conf

upstream users_backend {
    server localhost:9001 weight=3;
    server localhost:9002 weight=1;
    least_conn;
}

upstream default_backend {
    server localhost:9001;
}

server {
    listen 8080;
    listen 8443 ssl;

    ssl_certificate     ./certs/server.crt;
    ssl_certificate_key ./certs/server.key;

    # Limit request body size globally (overridable per location).
    client_max_body_size 10m;

    # Gzip compression.
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/html text/css application/json application/javascript;

    # Global rate limiting: 20 req/s, burst window defined per location.
    limit_req_zone $binary_remote_addr zone=global:10m rate=20r/s;

    location /users {
        proxy_pass         http://users_backend;
        proxy_read_timeout 10s;

        # Per-route body limit overrides server-level.
        client_max_body_size 5m;

        # Per-location rate limit using the global zone.
        limit_req zone=global burst=10;

        # Forward real client info to upstream.
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        proxy_pass         http://default_backend;
        proxy_read_timeout 30s;

        limit_req zone=global burst=50;
    }
}
